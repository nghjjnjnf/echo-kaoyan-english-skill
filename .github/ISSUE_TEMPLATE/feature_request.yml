name: 功能建议
description: 提议新的题型能力、规则或工作流改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 用户会怎样提问，当前为什么不够用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望输出和必要约束。
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 示例
      description: 请使用自拟或脱敏内容，不要上传受限全文。
