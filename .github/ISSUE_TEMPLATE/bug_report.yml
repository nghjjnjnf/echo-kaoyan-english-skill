name: 问题报告
description: 报告可复现的错误、错误解析或导入失败
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿上传完整真题、机构讲义或私人数据。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v0.1.0 或 commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 阅读理解
        - 完形填空
        - 翻译
        - 作文
        - 模拟题
        - DOCX 导入
        - 安装或触发
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供脱敏后的最小步骤和输入形式。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11、Codex App、Python 3.12
